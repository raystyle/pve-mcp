[workspace]
resolver = "2"
members = ["crates/pve-core", "crates/pve-server", "crates/test-support"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "time", "sync"] }
dunce = "1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "warn"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
