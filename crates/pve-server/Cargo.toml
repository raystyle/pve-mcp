[package]
name = "pve-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pve-mcp daemon, MCP server and CLI entry point"

[[bin]]
name = "pve-mcp"
path = "src/main.rs"

[dependencies]
pve-core = { path = "../pve-core" }
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dunce = { workspace = true }
libc = "0.2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3"
serde_json = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[lints]
workspace = true
